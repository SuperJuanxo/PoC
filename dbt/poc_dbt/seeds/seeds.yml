version: 2

seeds:

  - name: seed_PG_Socis_Completa

    description: "Datos dummy de socios para validar duplicidades y calidad de datos"

    columns:

      - name: Clau
        tests:
          - not_null

      - name: Soci
        tests:
          - not_null

      - name: NIF
        tests:
          - not_null

      - name: Situacio
        tests:
          - accepted_values:
              values: [0, 1, 2, 3]

  - name: seed_Masters
    description: |
      "Tabla de maestros para mapear Socis y Personas"

      Importancia:
      Esta columna identifica la tabla maestra a la que pertenece el registro.

      Reglas de calidad:
      - No puede ser nula.
      - Utilizada en el mapeo de maestros.
    meta:
      owner: Juanito
      casos: Uso distinto
      Extra data: los valores ABC indican CDE

    columns:

      - name: Tabla
        definition: "Esta es la tabla 1"
        Important: "esta columna nos indica blablabla queremos que no sea nulo, tiene test not null porque nulo es malo por ABC"
        tests:
          - not_null

      - name: Codigo_PG
        tests:
          - not_null

  - name: seed_PersonaRoles

    description: "Relación Persona-Rol"

    columns:

      - name: PersonaRol_Id
        tests:
          - unique
          - not_null
